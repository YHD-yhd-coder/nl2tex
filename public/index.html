<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nl2tex · 自然语言转公式</title>
<link rel="stylesheet" href="/katex/katex.min.css" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e6e8ee;
    --muted: #8b93a7; --accent: #4f8cff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: #1f6f2f; }
  .badge.warn { color: var(--warn); border-color: #6b4f13; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 18px; }
  textarea { width: 100%; min-height: 92px; resize: vertical; background: #0d0f13; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font: inherit; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  select, button { background: #1d222b; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  label.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
  .spacer { flex: 1; }
  .result { margin-top: 18px; }
  .math { overflow-x: auto; padding: 14px 4px; }
  .math .katex-display { margin: 0; }
  .src { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: #0d0f13; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; color: #b9c4dc; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 10px; }
  .note { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--warn); background: #1d1a12; color: #e3c98a; border-radius: 6px; font-size: 13px; }
  .err { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--err); background: #1f1315; color: #f0a5a5; border-radius: 6px; font-size: 13px; }
  .history { list-style: none; padding: 0; margin: 8px 0 0; }
  .history li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); cursor: pointer; }
  .history li:hover { color: var(--text); }
  .history code { color: #9fb4dc; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .alts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .alts button { font-size: 13px; padding: 6px 10px; }
  .alts button.active { border-color: var(--accent); color: #cfe0ff; }
  .thumb { max-height: 72px; max-width: 220px; border-radius: 6px; border: 1px solid var(--border); }
  .drop { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; color: var(--muted); font-size: 13px; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: #1d222b; border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; opacity: 0; transition: opacity .2s; font-size: 13px; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>nl2tex</h1>
    <span class="sub">自然语言 / 图片 → LaTeX → 编译校验</span>
    <span class="spacer"></span>
    <span id="status" class="badge">检测中…</span>
    <button id="settingsBtn" style="padding:5px 10px;font-size:12px">⚙ 设置</button>
  </header>

  <div class="card" id="settingsCard" hidden>
    <div class="sub" style="margin-bottom:8px">DeepSeek API Key（自带 Key，费用由你自己承担）</div>
    <div class="row" style="margin-top:0">
      <input id="keyInput" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false"
             style="flex:1;min-width:260px;background:#0d0f13;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font:inherit" />
      <button id="keySave" class="primary">保存</button>
      <button id="keyClear">清除</button>
    </div>
    <div class="hint">
      只保存在你这台机器的浏览器 localStorage 里，请求时只发给本机后端（127.0.0.1），不会上传到第三方。
      Key 在 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noreferrer" style="color:var(--accent)">platform.deepseek.com</a> 创建。
    </div>
  </div>

  <div class="card">
    <textarea id="input" placeholder="例如：求 k 从 1 到 n 的 k 平方&#10;或者：积分从 0 到无穷 e 的负 x 平方 dx&#10;Ctrl / ⌘ + Enter 直接生成"></textarea>
    <div class="row">
      <select id="subject">
        <option value="math">数学</option>
        <option value="physics">物理</option>
        <option value="chemistry">化学</option>
        <option value="cs">计算机</option>
        <option value="economics">经济/统计</option>
        <option value="biology">生物</option>
      </select>
      <label class="toggle"><input type="checkbox" id="thinking" /> 深度思考（慢，仅歧义时用）</label>
      <span class="spacer"></span>
      <button id="go" class="primary">生成公式</button>
    </div>
    <div class="row">
      <div class="drop" id="drop">也可以直接 <b>Ctrl+V 粘贴截图</b>，或
        <button id="pick" style="padding:2px 8px;font-size:12px">选择图片</button>
        <input type="file" id="file" accept="image/*" hidden />
      </div>
      <img id="thumb" class="thumb" hidden />
      <button id="ocr" hidden>识别图片</button>
    </div>
    <div class="hint">不计算、不化简，只做转写；有歧义时会给低置信度、说明，以及多个候选。</div>
  </div>

  <div class="card result" id="resultCard" hidden>
    <div class="math" id="math"></div>
    <div class="alts" id="alts"></div>
    <div class="src" id="src"></div>
    <div class="meta" id="meta"></div>
    <div class="note" id="note" hidden></div>
    <div class="err" id="err" hidden></div>
    <div class="row">
      <button data-copy="tex">复制 LaTeX</button>
      <button data-copy="dollar">复制 $…$</button>
      <button data-copy="mathml">复制 MathML</button>
      <button data-copy="omml">复制 Word 公式</button>
      <button id="again">重试</button>
      <span class="spacer"></span>
      <span class="hint" id="timing"></span>
    </div>
  </div>

  <div class="card">
    <div class="sub">最近生成</div>
    <ul class="history" id="history"></ul>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/katex/katex.min.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const input = $('input'), subject = $('subject'), thinking = $('thinking')
const go = $('go'), card = $('resultCard'), math = $('math'), src = $('src')
const meta = $('meta'), note = $('note'), err = $('err'), timing = $('timing')
const altsBox = $('alts'), thumb = $('thumb'), ocrBtn = $('ocr')
let current = null
let pendingImage = null
let history = []
let serverAuth = 'none'

// ---- 自带 Key：只存本机 localStorage ----
const KEY_STORAGE = 'nl2tex.apiKey'
const getKey = () => localStorage.getItem(KEY_STORAGE) || ''
const authHeaders = () => (getKey() ? { 'x-nl2tex-key': getKey() } : {})

function refreshStatus() {
  const s = $('status')
  const hasKey = !!getKey()
  const mode = hasKey ? 'user-key' : serverAuth
  const label =
    mode === 'user-key' ? '自带 Key' :
    mode === 'env-key' ? '环境变量 Key' :
    mode === 'dsh' ? '本机账号' : '未配置 Key'
  s.textContent = `${label} · deepseek-flash`
  s.className = 'badge ' + (mode === 'none' ? 'warn' : 'ok')
  $('keyInput').value = getKey()
}

$('settingsBtn').onclick = () => { $('settingsCard').hidden = !$('settingsCard').hidden }
$('keySave').onclick = () => {
  const v = $('keyInput').value.trim()
  if (!v) return
  localStorage.setItem(KEY_STORAGE, v)
  refreshStatus()
  toast('Key 已保存到本机')
}
$('keyClear').onclick = () => {
  localStorage.removeItem(KEY_STORAGE)
  $('keyInput').value = ''
  refreshStatus()
  toast('已清除本机 Key')
}

fetch('/api/health').then(r => r.json()).then(h => {
  serverAuth = h.auth
  refreshStatus()
}).catch(() => { refreshStatus() })

const toast = (msg) => {
  const t = $('toast'); t.textContent = msg; t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 1400)
}

function render(result) {
  current = result
  card.hidden = false
  math.innerHTML = result.html || ''
  src.textContent = result.latex || '(空)'
  const conf = result.confidence ?? 0
  meta.innerHTML = [
    `<span style="color:${result.valid ? 'var(--ok)' : 'var(--err)'}">${result.valid ? '编译通过' : '编译失败'}</span>`,
    `<span>置信度 ${conf.toFixed(2)}</span>`,
    `<span>${result.subject}</span>`,
    result.mode === 'image' ? '<span>图片识别</span>' : '',
    result.retried ? '<span>已重试一次</span>' : '',
    result.cached ? '<span>缓存命中</span>' : '',
  ].filter(Boolean).join('')

  note.hidden = !result.note
  note.textContent = result.note || ''
  err.hidden = result.valid
  err.textContent = result.valid ? '' : (result.error || '未知错误')
  timing.textContent = `${result.ms} ms`

  // 候选
  altsBox.innerHTML = ''
  if (result.alternatives && result.alternatives.length > 1) {
    result.alternatives.forEach((a, i) => {
      const b = document.createElement('button')
      b.textContent = `${i + 1}. ${a.label}`
      if (i === 0) b.classList.add('active')
      b.onclick = () => {
        ;[...altsBox.children].forEach(c => c.classList.remove('active'))
        b.classList.add('active')
        math.innerHTML = a.html
        src.textContent = a.latex
        current = { ...result, latex: a.latex, html: a.html }
      }
      altsBox.appendChild(b)
    })
  }
}

function addHistory(text, latex) {
  history.unshift({ text, latex })
  history = history.slice(0, 8)
  $('history').innerHTML = history
    .map((h, i) => `<li data-i="${i}"><span>${escapeHtml(h.text)}</span> → <code>${escapeHtml(h.latex)}</code></li>`)
    .join('')
  document.querySelectorAll('#history li').forEach(li => {
    li.onclick = () => { input.value = history[Number(li.dataset.i)].text; input.focus() }
  })
}
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function busy(on, label) {
  go.disabled = on; ocrBtn.disabled = on
  go.textContent = on ? '生成中…' : '生成公式'
  if (label) ocrBtn.textContent = label
}

function showError(message) {
  card.hidden = false
  math.innerHTML = ''; src.textContent = ''; meta.innerHTML = ''; altsBox.innerHTML = ''
  note.hidden = true
  err.hidden = false
  err.textContent = message
}

async function run() {
  const text = input.value.trim()
  if (!text) { input.focus(); return }
  busy(true)
  try {
    const res = await fetch('/api/nl2tex', {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text, subject: subject.value, thinking: thinking.checked }),
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`)
    render(data)
    if (data.valid && data.latex) addHistory(text, data.latex)
  } catch (e) {
    showError(String(e.message || e))
  } finally {
    busy(false)
    ocrBtn.textContent = '识别图片'
  }
}

async function runOcr() {
  if (!pendingImage) return
  busy(true, '识别中…')
  try {
    const res = await fetch('/api/ocr', {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ image: pendingImage, subject: subject.value }),
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`)
    render(data)
    if (data.valid && data.latex) addHistory('（图片）', data.latex)
  } catch (e) {
    showError(String(e.message || e))
  } finally {
    busy(false)
    ocrBtn.textContent = '识别图片'
  }
}

function setImage(dataUrl) {
  pendingImage = dataUrl
  thumb.src = dataUrl
  thumb.hidden = false
  ocrBtn.hidden = false
}

// 粘贴图片
document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'))
  if (!item) return
  e.preventDefault()
  const file = item.getAsFile()
  const reader = new FileReader()
  reader.onload = () => setImage(reader.result)
  reader.readAsDataURL(file)
})

$('pick').onclick = () => $('file').click()
$('file').onchange = (e) => {
  const file = e.target.files?.[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = () => setImage(reader.result)
  reader.readAsDataURL(file)
}

ocrBtn.onclick = runOcr
go.onclick = run
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run() }
})

// 导出 / 复制
document.querySelectorAll('[data-copy]').forEach(btn => {
  btn.onclick = async () => {
    if (!current?.latex) return
    const kind = btn.dataset.copy
    try {
      let text = current.latex
      if (kind === 'dollar') text = `$${current.latex}$$`
      if (kind === 'mathml' || kind === 'omml') {
        const r = await fetch('/api/export', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ latex: current.latex, to: kind }),
        })
        const d = await r.json()
        if (!r.ok) throw new Error(d.error)
        text = d.content
      }
      await navigator.clipboard.writeText(text)
      toast(kind === 'omml' ? '已复制 OMML，粘进 Word 即为公式' : '已复制')
    } catch (e) {
      toast('复制失败：' + e.message)
    }
  }
})
$('again').onclick = run

// ?q= 直接出结果
const params = new URLSearchParams(location.search)
if (params.get('settings')) $('settingsCard').hidden = false
if (params.get('q')) {
  input.value = params.get('q')
  if (params.get('subject')) subject.value = params.get('subject')
  run()
}
</script>
</body>
</html>
